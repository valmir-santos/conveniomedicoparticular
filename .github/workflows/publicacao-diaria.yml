# Publica os artigos agendados: todo dia às 06h (Brasília), se houver artigo com a data de
# hoje em src/data/blogData.ts, dispara um deploy na Vercel (o build gera o HTML pronto e o
# sitemap com o artigo) e avisa Bing e outros buscadores pelo IndexNow.
#
# Precisa de um segredo no GitHub (Settings > Secrets and variables > Actions):
#   VERCEL_DEPLOY_HOOK  URL do Deploy Hook criado na Vercel (Settings > Git > Deploy Hooks, branch main)
name: Publicação diária

on:
  schedule:
    - cron: '0 9 * * *' # 09h UTC = 06h em Brasília
  workflow_dispatch: # permite rodar na mão pela aba Actions

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SITE: https://www.conveniomedicoparticular.com.br
      INDEXNOW_KEY: 2dc6d58e84578eaf8464705d9011b457
    steps:
      - uses: actions/checkout@v7

      - name: Ver se há artigo para hoje
        id: hoje
        run: |
          HOJE=$(TZ=America/Sao_Paulo date +%F)
          SLUGS=$(grep -B12 "publishDate: '$HOJE'" src/data/blogData.ts | grep -o "slug: '[^']*'" | sed "s/slug: '\(.*\)'/\1/" | tr '\n' ' ')
          echo "hoje=$HOJE" >> "$GITHUB_OUTPUT"
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          if [ -z "$SLUGS" ]; then echo "Nenhum artigo agendado para $HOJE."; else echo "Artigos de $HOJE: $SLUGS"; fi

      - name: Disparar deploy na Vercel
        if: steps.hoje.outputs.slugs != ''
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Falta o segredo VERCEL_DEPLOY_HOOK (veja o topo deste arquivo)."
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"

      - name: Esperar o artigo entrar no ar
        if: steps.hoje.outputs.slugs != ''
        run: |
          PRIMEIRO=$(echo "${{ steps.hoje.outputs.slugs }}" | awk '{print $1}')
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/blog/$PRIMEIRO")
            if [ "$STATUS" = "200" ]; then echo "No ar: $SITE/blog/$PRIMEIRO"; exit 0; fi
            echo "Ainda não ($STATUS), tentando de novo em 30s..."
            sleep 30
          done
          echo "::error::O artigo não entrou no ar em 20 minutos. Veja o deploy na Vercel."
          exit 1

      - name: Avisar os buscadores (IndexNow)
        if: steps.hoje.outputs.slugs != ''
        run: |
          URLS=$(for s in ${{ steps.hoje.outputs.slugs }}; do printf '"%s/blog/%s",' "$SITE" "$s"; done)
          BODY="{\"host\":\"www.conveniomedicoparticular.com.br\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"$SITE/$INDEXNOW_KEY.txt\",\"urlList\":[${URLS}\"$SITE/blog\"]}"
          echo "$BODY"
          curl -sS -o /dev/null -w "IndexNow respondeu %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" -d "$BODY"
