<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="navyGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F2B48" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0D263F" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Base (Clean white with subtle rounded edge for app icon standard) -->
  <rect width="128" height="128" rx="28" fill="#FFFFFF" />

  <!-- Interlocking Dual Ribbon Healthcare Emblem -->
  <g transform="translate(16, 16) scale(0.75)" filter="url(#subtleGlow)">
    <!-- Top-Left to Bottom-Right Primary Loop -->
    <path
      d="M64 12 C82 12, 108 30, 114 46 C119 59, 115 76, 102 90 C88 105, 68 116, 52 116 C34 116, 12 96, 12 76 C12 60, 22 46, 36 34 L48 48 C40 56, 34 66, 34 76 C34 86, 46 96, 56 96 C68 96, 82 86, 90 76 C98 66, 96 56, 90 48 C82 38, 68 32, 56 32 Z"
      fill="url(#blueGrad1)"
    />

    <!-- Bottom-Left to Top-Right Secondary Intertwined Loop -->
    <path
      d="M64 116 C46 116, 20 98, 14 82 C9 69, 13 52, 26 38 C40 23, 60 12, 76 12 C94 12, 116 32, 116 52 C116 68, 106 82, 92 94 L80 80 C88 72, 94 62, 94 52 C94 42, 82 32, 72 32 C60 32, 46 42, 38 52 C30 62, 32 72, 38 80 C46 90, 60 96, 72 96 Z"
      fill="url(#navyGrad2)"
    />

    <!-- Central Organic Leaf & Negative Space Fusion -->
    <path
      d="M64 36 C76 48, 80 66, 68 84 C56 72, 52 54, 64 36 Z"
      fill="url(#leafGrad)"
      opacity="0.95"
    />
    <path
      d="M64 42 Q66 60 62 78"
      stroke="#1E3A8A"
      stroke-width="2.5"
      stroke-linecap="round"
      fill="none"
      opacity="0.7"
    />
  </g>
</svg>
